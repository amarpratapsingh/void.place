<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>void.place — Infinite Pixel Canvas</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d0f12;
        color: #f0f3f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        touch-action: none;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Dynamic Canvas Cursors */
      body.tool-pencil #canvas-container { cursor: crosshair; }
      body.tool-eraser #canvas-container { cursor: cell; }
      body.tool-pan #canvas-container { cursor: grab; }
      body.tool-pan.dragging #canvas-container { cursor: grabbing; }
      body.tool-picker #canvas-container { cursor: copy; }

      #hud {
        position: absolute;
        pointer-events: none;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .hud-element {
        pointer-events: auto;
      }

      /* Top Left: Logo & Coords */
      .hud-top-left {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(18, 22, 28, 0.88);
        backdrop-filter: blur(12px);
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }
      .brand-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .brand-badge {
        font-size: 10px;
        background: rgba(168, 85, 247, 0.25);
        color: #c084fc;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 600;
      }
      .coords-display {
        font-family: monospace;
        font-size: 12px;
        color: #94a3b8;
      }
      .active-sector {
        font-size: 11px;
        color: #38bdf8;
      }

      /* Top Right: Compass, Share, Dive */
      .hud-top-right {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn {
        border: none;
        border-radius: 8px;
        padding: 9px 14px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .btn-dive {
        background: linear-gradient(135deg, #6366f1, #a855f7);
        color: white;
        box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      }
      .btn-dive:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.55);
      }
      .btn-share {
        background: rgba(255, 255, 255, 0.08);
        color: #f1f5f9;
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
      }
      .btn-share:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-1px);
      }
      .btn-radar {
        background: rgba(15, 23, 42, 0.85);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.25);
        backdrop-filter: blur(8px);
        font-family: monospace;
      }
      .btn-radar:hover {
        background: rgba(56, 189, 248, 0.15);
        border-color: #38bdf8;
      }
      .btn:active {
        transform: translateY(1px);
      }

      /* Left Canvas-Style Toolbar */
      .canvas-toolbar {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(18, 22, 28, 0.92);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      }
      .tool-btn {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: #94a3b8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
        position: relative;
        transition: all 0.15s ease;
      }
      .tool-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
      }
      .tool-btn.active {
        background: #6366f1;
        color: white;
        border-color: #818cf8;
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
      }
      .tool-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        margin: 4px 2px;
      }

      /* Pixel Size Selector */
      .size-selector {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
        padding-top: 2px;
      }
      .size-btn {
        width: 32px;
        height: 24px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: #94a3b8;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .size-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .size-btn.active {
        background: rgba(168, 85, 247, 0.35);
        color: #e9d5ff;
        border-color: #a855f7;
      }

      /* Bottom Canvas Palette Dock */
      .palette-dock {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(18, 22, 28, 0.94);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        align-items: center;
      }
      .palette-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .active-color-preview {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 2px solid white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .active-color-preview input[type="color"] {
        position: absolute;
        top: -10px;
        left: -10px;
        width: 50px;
        height: 50px;
        opacity: 0;
        cursor: pointer;
      }
      .swatches-grid {
        display: grid;
        grid-template-columns: repeat(8, 22px);
        grid-template-rows: repeat(2, 22px);
        gap: 4px;
      }
      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.3);
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .swatch:hover {
        transform: scale(1.15);
        z-index: 2;
      }
      .swatch.selected {
        outline: 2px solid white;
        outline-offset: 1px;
        transform: scale(1.1);
      }

      /* Compact Ink Gauge in Palette Dock */
      .ink-dock-line {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }
      .ink-mini-bar-bg {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .ink-mini-bar-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ec4899, #a855f7, #38bdf8);
        border-radius: 3px;
        transition: width 0.08s ease-out;
      }
      .ink-mini-label {
        font-size: 11px;
        font-family: monospace;
        color: #94a3b8;
        min-width: 32px;
        text-align: right;
      }

      /* Toast Notification */
      #toast {
        position: absolute;
        top: 75px;
        left: 50%;
        transform: translateX(-50%) translateY(-15px);
        background: #10b981;
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body class="tool-pencil">
    <div id="canvas-container"></div>
    <div id="hud">
      <!-- Top Left: Title & Coordinates -->
      <div class="hud-element hud-top-left">
        <div class="brand-title">
          <span>void.place</span>
          <span class="brand-badge">PIXEL ART</span>
        </div>
        <div id="coords" class="coords-display">x: 0 | y: 0 | zoom: 1.00x</div>
        <div id="sector" class="coords-display active-sector">Sector: sector:z0:x0:y0</div>
      </div>

      <!-- Top Right: Compass, Share, Dive -->
      <div class="hud-element hud-top-right">
        <button id="radar-btn" class="btn btn-radar" title="Fly to Origin (0,0)">
          <span id="radar-icon">🎯</span> <span id="radar-text">At Origin</span>
        </button>
        <button id="share-btn" class="btn btn-share" title="Copy coordinate link">
          🔗 Share Location
        </button>
        <button id="dive-btn" class="btn btn-dive" title="Hyperspace dive into active void sector">
          ✨ Dive into Void
        </button>
      </div>

      <!-- Left: Canvas Pixel Toolbar -->
      <div class="hud-element canvas-toolbar">
        <button id="tool-pencil" class="tool-btn active" title="Pixel Pencil (B)">✏️</button>
        <button id="tool-eraser" class="tool-btn" title="Eraser (E)">🧹</button>
        <button id="tool-picker" class="tool-btn" title="Eyedropper (I)">💧</button>
        <button id="tool-pan" class="tool-btn" title="Pan Hand (H or hold Space)">🖐️</button>
        <div class="tool-divider"></div>
        <button id="toggle-grid" class="tool-btn active" title="Toggle Pixel Grid (G)">▦</button>
        <div class="tool-divider"></div>
        <div class="size-selector">
          <button class="size-btn active" data-size="1" title="1x1 Pixel">1px</button>
          <button class="size-btn" data-size="2" title="2x2 Pixels">2px</button>
          <button class="size-btn" data-size="4" title="4x4 Pixels">4px</button>
          <button class="size-btn" data-size="8" title="8x8 Pixels">8px</button>
        </div>
      </div>

      <!-- Bottom: Palette Dock with Swatches & Ink -->
      <div class="hud-element palette-dock">
        <div class="palette-row">
          <div id="active-color-swatch" class="active-color-preview" title="Click to pick custom color">
            <input type="color" id="custom-color-input" value="#ff004d" />
          </div>
          <div id="palette-swatches" class="swatches-grid">
            <!-- 16 Retro Pixel Swatches will be injected here -->
          </div>
        </div>
        <div class="ink-dock-line">
          <div class="ink-mini-bar-bg">
            <div id="ink-fill" class="ink-mini-bar-fill"></div>
          </div>
          <span id="ink-percent" class="ink-mini-label">100%</span>
        </div>
      </div>

      <!-- Toast for share link & alerts -->
      <div id="toast">Coordinates link copied to clipboard!</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
