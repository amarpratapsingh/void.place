<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>void.place — Infinite Canvas Social</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d0f12;
        color: #f0f3f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        touch-action: none;
      }
      #hud {
        position: absolute;
        pointer-events: none;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .hud-element {
        pointer-events: auto;
      }
      .hud-top-left {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(18, 22, 28, 0.85);
        backdrop-filter: blur(8px);
        padding: 12px 18px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hud-top-right {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 12px;
      }
      .btn-dive {
        background: linear-gradient(135deg, #6366f1, #a855f7);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn-dive:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
      }
      .btn-dive:active {
        transform: translateY(1px);
      }
      .coords-display {
        font-family: monospace;
        font-size: 12px;
        color: #94a3b8;
      }
      .active-sector {
        font-size: 11px;
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud">
      <div class="hud-element hud-top-left">
        <h1 style="font-size: 16px; font-weight: 700; letter-spacing: -0.5px;">void.place</h1>
        <div id="coords" class="coords-display">x: 0 | y: 0 | zoom: 1.00x</div>
        <div id="sector" class="coords-display active-sector">Sector: sector:z0:x0:y0</div>
      </div>
      <div class="hud-element hud-top-right">
        <button id="dive-btn" class="btn-dive">✨ Dive into the Void</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
