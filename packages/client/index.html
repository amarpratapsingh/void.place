<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>void.place — Deep Space Infinite Pixel Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void-deep: #030508;
        --panel-bg: rgba(7, 11, 18, 0.88);
        --panel-border: rgba(0, 240, 255, 0.18);
        --panel-border-glow: rgba(0, 240, 255, 0.35);
        --cyan-phosphor: #00f0ff;
        --amber-stellar: #ffb020;
        --plasma-magenta: #ff0055;
        --emerald-online: #00ff88;
        --text-primary: #e2e8f0;
        --text-muted: #64748b;
        --font-pixel: 'Silkscreen', monospace;
        --font-mono: 'Share Tech Mono', monospace;
        --font-display: 'Chakra Petch', sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--void-deep);
        color: var(--text-primary);
        font-family: var(--font-display);
      }

      #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        touch-action: none;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* CRT Scanline & Ambient Vignette */
      .crt-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.6) 100%),
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
        background-size: 100% 100%, 100% 4px;
        z-index: 5;
      }

      /* Dynamic Canvas Cursors */
      body.tool-pencil #canvas-container { cursor: crosshair; }
      body.tool-eraser #canvas-container { cursor: cell; }
      body.tool-pan #canvas-container { cursor: grab; }
      body.tool-pan.dragging #canvas-container { cursor: grabbing; }
      body.tool-picker #canvas-container { cursor: copy; }

      #hud {
        position: absolute;
        pointer-events: none;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
      }

      .hud-element {
        pointer-events: auto;
      }

      /* Staggered Boot Sequence Animations */
      @keyframes bootDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bootLeft {
        from {
          opacity: 0;
          transform: translateY(-50%) translateX(-25px);
        }
        to {
          opacity: 1;
          transform: translateY(-50%) translateX(0);
        }
      }

      @keyframes bootUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(25px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      /* Top Left: Terminal Telemetry */
      .hud-top-left {
        position: absolute;
        top: 18px;
        left: 18px;
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        padding: 10px 16px;
        border-radius: 6px;
        border: 1px solid var(--panel-border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        gap: 5px;
        animation: bootDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }

      .brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-name {
        font-family: var(--font-pixel);
        font-size: 14px;
        letter-spacing: -0.5px;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      }

      .brand-badge {
        font-family: var(--font-pixel);
        font-size: 9px;
        background: rgba(0, 240, 255, 0.12);
        color: var(--cyan-phosphor);
        padding: 2px 6px;
        border-radius: 3px;
        border: 1px solid rgba(0, 240, 255, 0.25);
        letter-spacing: 0.5px;
      }

      .coords-display {
        font-family: var(--font-mono);
        font-size: 12px;
        color: #94a3b8;
        letter-spacing: 0.5px;
      }

      .active-sector {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--cyan-phosphor);
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
      }

      /* Top Right: Flight Navigation & Hyperdrive */
      .hud-top-right {
        position: absolute;
        top: 18px;
        right: 18px;
        display: flex;
        gap: 10px;
        align-items: center;
        animation: bootDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      }

      .btn {
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 8px 14px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.5px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: all 0.15s ease;
      }

      .btn:active {
        transform: translateY(1px) scale(0.98);
      }

      /* Warp Dive: Illuminated Hazardous Launch Switch */
      .btn-dive {
        background: linear-gradient(135deg, #ff4400, #ffb400);
        color: #0b0d10;
        font-family: var(--font-pixel);
        font-size: 11px;
        font-weight: 700;
        border-color: #ffcc00;
        box-shadow: 0 0 16px rgba(255, 120, 0, 0.45);
        text-transform: uppercase;
      }

      .btn-dive:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 24px rgba(255, 160, 0, 0.7);
        filter: brightness(1.1);
      }

      .btn-share {
        background: var(--panel-bg);
        color: #e2e8f0;
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(12px);
      }

      .btn-share:hover {
        border-color: var(--cyan-phosphor);
        color: var(--cyan-phosphor);
        box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        transform: translateY(-1px);
      }

      .btn-radar {
        background: var(--panel-bg);
        color: var(--cyan-phosphor);
        border: 1px solid var(--panel-border);
        font-family: var(--font-mono);
        backdrop-filter: blur(12px);
      }

      .btn-radar:hover {
        border-color: var(--cyan-phosphor);
        background: rgba(0, 240, 255, 0.08);
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
      }

      .radar-reticle {
        font-size: 14px;
        color: var(--amber-stellar);
        display: inline-block;
      }

      /* Left: Cybernetic Tool Console */
      .canvas-toolbar {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--panel-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        animation: bootLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
      }

      .tool-btn {
        width: 38px;
        height: 38px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.02);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
        position: relative;
        transition: all 0.15s ease;
      }

      .tool-btn:hover {
        background: rgba(0, 240, 255, 0.06);
        color: #fff;
        border-color: rgba(0, 240, 255, 0.2);
      }

      .tool-btn.active {
        background: rgba(0, 240, 255, 0.14);
        color: var(--cyan-phosphor);
        border-color: var(--cyan-phosphor);
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.3), inset 0 0 8px rgba(0, 240, 255, 0.2);
      }

      .tool-btn.active::after {
        content: '';
        position: absolute;
        left: -4px;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 16px;
        background: var(--cyan-phosphor);
        border-radius: 2px;
        box-shadow: 0 0 6px var(--cyan-phosphor);
      }

      .tool-divider {
        height: 1px;
        background: rgba(0, 240, 255, 0.12);
        margin: 4px 2px;
      }

      .size-selector {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
      }

      .size-btn {
        width: 32px;
        height: 22px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .size-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      .size-btn.active {
        background: rgba(255, 176, 32, 0.2);
        color: var(--amber-stellar);
        border-color: var(--amber-stellar);
        box-shadow: 0 0 8px rgba(255, 176, 32, 0.3);
      }

      /* Bottom: Tactical Color Palette & Ink Conduit */
      .palette-dock {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel-bg);
        backdrop-filter: blur(18px);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 10px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        align-items: center;
        animation: bootUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }

      .palette-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .active-color-preview {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .active-color-preview input[type="color"] {
        position: absolute;
        top: -10px;
        left: -10px;
        width: 60px;
        height: 60px;
        opacity: 0;
        cursor: pointer;
      }

      .swatches-grid {
        display: grid;
        grid-template-columns: repeat(8, 22px);
        grid-template-rows: repeat(2, 22px);
        gap: 5px;
      }

      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 3px;
        border: 1px solid rgba(0, 0, 0, 0.5);
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }

      .swatch:hover {
        transform: scale(1.18);
        box-shadow: 0 0 8px currentColor;
        z-index: 2;
      }

      .swatch.selected {
        outline: 2px solid #fff;
        outline-offset: 1px;
        transform: scale(1.12);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      /* Phosphor Void Matter (Ink) Gauge */
      .ink-dock-line {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .ink-tag {
        font-family: var(--font-pixel);
        font-size: 9px;
        color: var(--amber-stellar);
        letter-spacing: 0.5px;
      }

      .ink-mini-bar-bg {
        flex: 1;
        height: 6px;
        background: rgba(0, 240, 255, 0.08);
        border: 1px solid rgba(0, 240, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
        padding: 1px;
      }

      .ink-mini-bar-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ff0055, #ffb020, #00f0ff);
        border-radius: 1px;
        box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        transition: width 0.08s ease-out;
      }

      .ink-mini-label {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--cyan-phosphor);
        min-width: 38px;
        text-align: right;
        font-weight: 700;
      }

      /* Cybernetic Toast Notification */
      #toast {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(-15px);
        background: rgba(7, 11, 18, 0.95);
        color: var(--cyan-phosphor);
        border: 1px solid var(--cyan-phosphor);
        padding: 8px 18px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
      }

      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body class="tool-pencil">
    <div class="crt-overlay"></div>
    <div id="canvas-container"></div>
    <div id="hud">
      <!-- Top Left: Telemetry & Navigation -->
      <div class="hud-element hud-top-left">
        <div class="brand-title">
          <span class="brand-name">void.place</span>
          <span class="brand-badge">PIXEL OBSERVATORY</span>
        </div>
        <div id="coords" class="coords-display">X: +0.0 · Y: +0.0 · MAG: 1.00x</div>
        <div id="sector" class="active-sector">SECTOR // sector:z0:x0:y0</div>
      </div>

      <!-- Top Right: Flight Instruments, Share, Warp -->
      <div class="hud-element hud-top-right">
        <button id="radar-btn" class="btn btn-radar" title="Engage autopilot to Singularity [0,0]">
          <span id="radar-icon" class="radar-reticle">⌖</span>
          <span id="radar-text">SINGULARITY [0,0]</span>
        </button>
        <button id="share-btn" class="btn btn-share" title="Copy quantum deep link to current coordinates">
          🔗 Copy Vector
        </button>
        <button id="dive-btn" class="btn btn-dive" title="Trigger hyperspace jump into uncharted sector">
          [ ⟁ WARP DIVE ]
        </button>
      </div>

      <!-- Left: Cybernetic Tool Dock -->
      <div class="hud-element canvas-toolbar">
        <button id="tool-pencil" class="tool-btn active" title="Pixel Matrix Brush (B / P)">✏️</button>
        <button id="tool-eraser" class="tool-btn" title="Void Eraser (E)">🧹</button>
        <button id="tool-picker" class="tool-btn" title="Spectrometer Eyedropper (I)">💧</button>
        <button id="tool-pan" class="tool-btn" title="Astro-Pan Hand (H or hold Space)">🖐️</button>
        <div class="tool-divider"></div>
        <button id="toggle-grid" class="tool-btn active" title="Toggle Coordinate Grid (G)">▦</button>
        <div class="tool-divider"></div>
        <div class="size-selector">
          <button class="size-btn active" data-size="1" title="1x1 Discrete Pixel">1px</button>
          <button class="size-btn" data-size="2" title="2x2 Discrete Pixels">2px</button>
          <button class="size-btn" data-size="4" title="4x4 Discrete Pixels">4px</button>
          <button class="size-btn" data-size="8" title="8x8 Discrete Pixels">8px</button>
        </div>
      </div>

      <!-- Bottom: Palette Console & Void Matter Conduit -->
      <div class="hud-element palette-dock">
        <div class="palette-row">
          <div id="active-color-swatch" class="active-color-preview" title="Calibrate custom RGB spectrum">
            <input type="color" id="custom-color-input" value="#ff004d" />
          </div>
          <div id="palette-swatches" class="swatches-grid">
            <!-- 16 Retro Pixel Swatches -->
          </div>
        </div>
        <div class="ink-dock-line">
          <span class="ink-tag">VOID MATTER</span>
          <div class="ink-mini-bar-bg">
            <div id="ink-fill" class="ink-mini-bar-fill"></div>
          </div>
          <span id="ink-percent" class="ink-mini-label">100%</span>
        </div>
      </div>

      <!-- Toast for vector copy & alerts -->
      <div id="toast">VECTOR COORDINATES COPIED TO CLIPBOARD</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
